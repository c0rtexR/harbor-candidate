<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <!-- systems usually tell you more than interfaces do -->
    <title>Find the Flag</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #061923;
        color: #f2f7f8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 110%, rgba(76, 201, 240, 0.14), transparent 46%),
          #061923;
      }

      main {
        width: min(86vw, 42rem);
        padding: 2.5rem 1.5rem;
        text-align: center;
        display: grid;
        justify-items: center;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.5rem, 8vw, 5.5rem);
        font-weight: 650;
        letter-spacing: -0.055em;
        line-height: 0.96;
      }

      code {
        display: block;
        margin-top: 1.8rem;
        color: #72d7f2;
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        font-size: clamp(1rem, 3.5vw, 1.35rem);
        letter-spacing: 0.04em;
      }

      p {
        margin: 2.25rem 0 0;
        color: #9cb0b9;
        font-size: 0.78rem;
        font-weight: 650;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }

      .environment-probe {
        position: relative;
        width: min(72vw, 26rem);
        aspect-ratio: 16 / 10;
        margin-top: 2.25rem;
        overflow: hidden;
        border: 1px solid rgba(114, 215, 242, 0.4);
        border-radius: 0.35rem;
        background:
          linear-gradient(135deg, rgba(114, 215, 242, 0.08), transparent 55%),
          rgba(1, 12, 18, 0.55);
        color: #72d7f2;
        text-decoration: none;
      }

      .environment-probe img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .environment-probe::after {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        content: "IMAGE UNAVAILABLE";
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        font-size: 0.72rem;
        font-weight: 650;
        letter-spacing: 0.18em;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Find the Flag</h1>
      <a
        class="environment-probe"
        href="https://github.com/c0rtexR/harbor-candidate"
        aria-label="Open missing cargo image source"
      >
        <img
          src="https://github.com/c0rtexR/harbor-candidate/raw/refs/heads/main/cargo-481.png"
          alt=""
        >
      </a>
      <code>MAERSK{...}</code>
      <p>You have 30 minutes.</p>
    </main>
  </body>
</html>
