<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="environment" content="harbor://candidate">
    <!-- systems usually tell you more than interfaces do -->
    <title>Find the Flag</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #061923;
        color: #f2f7f8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 110%, rgba(76, 201, 240, 0.14), transparent 46%),
          #061923;
      }

      main {
        width: min(86vw, 42rem);
        padding: 3rem 1.5rem;
        text-align: center;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.5rem, 8vw, 5.5rem);
        font-weight: 650;
        letter-spacing: -0.055em;
        line-height: 0.96;
      }

      code {
        display: block;
        margin-top: 2rem;
        color: #72d7f2;
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        font-size: clamp(1rem, 3.5vw, 1.35rem);
        letter-spacing: 0.04em;
      }

      p {
        margin: 2.25rem 0 0;
        color: #9cb0b9;
        font-size: 0.78rem;
        font-weight: 650;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Find the Flag</h1>
      <code>MAERSK{...}</code>
      <p>You have 30 minutes.</p>
    </main>
  </body>
</html>
